    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="description" content="Career Wings - Find verified jobs in Guwahati, Assam & Northeast India. Connect directly with top employers hiring across IT, Banking, Healthcare, Sales, and Engineering." />
    <meta name="keywords" content="jobs in guwahati, jobs in assam, jobs in northeast india, career wings, recruitment, employment, private jobs assam, fresher jobs guwahati" />

    <link rel="sitemap" type="application/xml" title="Sitemap" href="https://careerwings.in/sitemap.xml" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="Career Wings" />
    <meta property="og:locale" content="en_IN" />
    <meta property="og:title" content="Jobs in Guwahati, Assam &amp; Northeast India | Career Wings" />
    <meta property="og:description" content="Career Wings is Northeast India's trusted job portal. Browse verified job openings in Guwahati, Assam &amp; across Northeast India with zero placement fees." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://careerwings.in/" />
    <meta property="og:image" content="https://careerwings.in/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Jobs in Guwahati, Assam &amp; Northeast India | Career Wings" />
    <meta name="twitter:description" content="Find verified job openings in Guwahati, Assam &amp; Northeast India. Connect directly with top employers on Career Wings." />
    <meta name="twitter:image" content="https://careerwings.in/og-image.jpg" />

    <!-- Structured Data: Organization & WebSite SearchAction -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://careerwings.in/#organization",
            "name": "Career Wings",
            "url": "https://careerwings.in/",
            "logo": "https://careerwings.in/images/logo.png",
            "description": "Northeast India's premier job portal connecting skilled candidates with verified employers across Assam, Meghalaya, and Pan-India.",
            "address": {
              "@type": "PostalAddress",
              "streetAddress": "Zoo Road Tiniali, Hriday Ranjan Path, By Lane 6, House No 5",
              "addressLocality": "Guwahati",
              "addressRegion": "Assam",
              "postalCode": "781003",
              "addressCountry": "IN"
            },
            "contactPoint": {
              "@type": "ContactPoint",
              "telephone": "+91-8876211864",
              "contactType": "customer support",
              "email": "info@careerwings.in",
              "areaServed": "IN"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://careerwings.in/#website",
            "url": "https://careerwings.in/",
            "name": "Career Wings",
            "publisher": { "@id": "https://careerwings.in/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://careerwings.in/jobs?keyword={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
    <title>Jobs in Guwahati, Assam &amp; Northeast India | Career Wings</title>
  </head>
  <body>
    <div id="root"></div>
